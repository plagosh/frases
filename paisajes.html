<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paisaje del día</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #191919;
    overflow: hidden;
  }
  .card {
    position: relative;
    width: 100%;
    height: 100vh;
    background: #191919;
  }
  .foto {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0;
    transition: opacity 1s ease;
  }
  .foto.visible { opacity: 1; }
  .overlay {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 2rem 2rem 1.5rem;
    background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.2) 60%, transparent 100%);
  }
  .lugar {
    font-size: 1.5rem;
    font-weight: 600;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    letter-spacing: 0.02em;
    text-shadow: 0 1px 6px rgba(0,0,0,0.6);
    margin-bottom: 0.3rem;
  }
  .pais {
    font-size: 0.8rem;
    color: rgba(255,255,255,0.7);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
  .credit {
    position: absolute;
    top: 10px; right: 12px;
    font-size: 0.62rem;
    color: rgba(255,255,255,0.45);
    font-family: -apple-system, sans-serif;
  }
  .credit a { color: inherit; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <img class="foto" id="foto" alt="Paisaje del día"/>
  <div class="overlay">
    <div class="lugar" id="lugar"></div>
    <div class="pais" id="pais"></div>
  </div>
  <div class="credit" id="credit"></div>
</div>
<script>
const ACCESS_KEY = 'akvWKEesAv1t1lsEIZSc6AL7MfTkGTn9YD5o7cUdoDU';

const lugares = [
  { query: 'patagonia chile landscape', lugar: 'Patagonia', pais: 'Chile' },
  { query: 'santorini greece', lugar: 'Santorini', pais: 'Grecia' },
  { query: 'machu picchu peru', lugar: 'Machu Picchu', pais: 'Perú' },
  { query: 'kyoto japan temple', lugar: 'Kioto', pais: 'Japón' },
  { query: 'amalfi coast italy', lugar: 'Costa Amalfi', pais: 'Italia' },
  { query: 'aurora borealis iceland', lugar: 'Aurora Boreal', pais: 'Islandia' },
  { query: 'grand canyon usa', lugar: 'Gran Cañón', pais: 'Estados Unidos' },
  { query: 'sahara desert morocco', lugar: 'Desierto del Sahara', pais: 'Marruecos' },
  { query: 'maldives ocean', lugar: 'Maldivas', pais: 'Maldivas' },
  { query: 'banff national park canada', lugar: 'Parque Nacional Banff', pais: 'Canadá' },
  { query: 'rio de janeiro brazil', lugar: 'Río de Janeiro', pais: 'Brasil' },
  { query: 'hallstatt austria', lugar: 'Hallstatt', pais: 'Austria' },
  { query: 'torres del paine chile', lugar: 'Torres del Paine', pais: 'Chile' },
  { query: 'bali temple indonesia', lugar: 'Bali', pais: 'Indonesia' },
  { query: 'colosseum rome italy', lugar: 'Roma', pais: 'Italia' },
  { query: 'new zealand fiordland', lugar: 'Fiordland', pais: 'Nueva Zelanda' },
  { query: 'venice canal italy', lugar: 'Venecia', pais: 'Italia' },
  { query: 'atacama desert chile', lugar: 'Desierto de Atacama', pais: 'Chile' },
  { query: 'paris eiffel tower', lugar: 'París', pais: 'Francia' },
  { query: 'amazon rainforest brazil', lugar: 'Amazonas', pais: 'Brasil' },
  { query: 'cape town south africa', lugar: 'Ciudad del Cabo', pais: 'Sudáfrica' },
  { query: 'swiss alps mountain', lugar: 'Alpes Suizos', pais: 'Suiza' },
  { query: 'angkor wat cambodia', lugar: 'Angkor Wat', pais: 'Camboya' },
  { query: 'valparaiso chile', lugar: 'Valparaíso', pais: 'Chile' },
  { query: 'northern lights norway', lugar: 'Lofoten', pais: 'Noruega' },
  { query: 'budapest hungary night', lugar: 'Budapest', pais: 'Hungría' },
  { query: 'zhangjiajie china mountain', lugar: 'Zhangjiajie', pais: 'China' },
  { query: 'patagonia argentina lake', lugar: 'Bariloche', pais: 'Argentina' },
  { query: 'lisbon portugal city', lugar: 'Lisboa', pais: 'Portugal' },
  { query: 'lake baikal russia', lugar: 'Lago Baikal', pais: 'Rusia' },
  { query: 'dubrovnik croatia', lugar: 'Dubrovnik', pais: 'Croacia' },
  { query: 'uluru australia', lugar: 'Uluru', pais: 'Australia' },
  { query: 'plitvice lakes croatia', lugar: 'Lagos de Plitvice', pais: 'Croacia' },
  { query: 'taj mahal india', lugar: 'Taj Mahal', pais: 'India' },
  { query: 'galapagos islands ecuador', lugar: 'Islas Galápagos', pais: 'Ecuador' },
  { query: 'copenhagen denmark', lugar: 'Copenhague', pais: 'Dinamarca' },
  { query: 'easter island chile', lugar: 'Isla de Pascua', pais: 'Chile' },
];

const hoy = new Date();
const idx = (hoy.getFullYear() * 365 + hoy.getMonth() * 31 + hoy.getDate()) % lugares.length;
const destino = lugares[idx];

fetch(`https://api.unsplash.com/photos/random?query=${encodeURIComponent(destino.query)}&orientation=landscape&client_id=${ACCESS_KEY}`)
  .then(r => r.json())
  .then(data => {
    const img = document.getElementById('foto');
    img.onload = () => img.classList.add('visible');
    img.src = data.urls.regular;
    document.getElementById('lugar').textContent = destino.lugar;
    document.getElementById('pais').textContent = destino.pais;
    const profileUrl = data.user.links.html + '?utm_source=paisajes_widget&utm_medium=referral';
    document.getElementById('credit').innerHTML = `Foto: <a href="${profileUrl}" target="_blank">${data.user.name}</a> / Unsplash`;
  });
</script>
</body>
</html>
