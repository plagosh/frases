<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finanzas</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#191919; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; padding:1.2rem; min-height:100vh; color:#e0e0e0; }
.header { display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem; }
.titulo { font-size:0.95rem; font-weight:600; color:#e0e0e0; }
.mes-nav { display:flex; align-items:center; gap:6px; }
.btn-mes { background:#2a2a2a; border:1px solid #3a3a3a; border-radius:8px; color:#e0e0e0; font-size:0.8rem; padding:4px 10px; cursor:pointer; }
.btn-mes:hover { background:#3a3a3a; }
.mes-actual { font-size:0.85rem; font-weight:600; color:#a0a0f0; min-width:110px; text-align:center; }
.metricas-top { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:1rem; }
.card { background:#242424; border-radius:12px; padding:0.9rem 1rem; }
.card-label { font-size:0.67rem; color:#777; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:4px; }
.card-valor { font-size:1.1rem; font-weight:600; }
.card-valor.ingreso { color:#4caf82; }
.card-valor.gasto { color:#e07070; }
.card-valor.pos { color:#4caf82; }
.card-valor.neg { color:#e07070; }
.card-pct { font-size:0.68rem; color:#777; margin-top:2px; }
.pct-falta { background:#242424; border-radius:10px; padding:0.7rem 1rem; margin-bottom:1rem; }
.pct-label { font-size:0.68rem; color:#777; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:6px; }
.pct-barra-track { background:#2e2e2e; border-radius:6px; height:10px; overflow:hidden; }
.pct-barra-fill { height:100%; border-radius:6px; background:linear-gradient(to right,#4caf82,#ffd166,#e07070); transition:width 0.6s; }
.pct-textos { display:flex; justify-content:space-between; margin-top:4px; font-size:0.7rem; color:#aaa; }
.seccion-titulo { font-size:0.7rem; font-weight:600; color:#aaa; text-transform:uppercase; letter-spacing:0.08em; margin:0.8rem 0 0.5rem; }
.cat-bloque { background:#242424; border-radius:10px; margin-bottom:6px; overflow:hidden; }
.cat-header { display:flex; align-items:center; gap:8px; padding:0.6rem 0.9rem; cursor:pointer; user-select:none; }
.cat-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
.cat-nombre { font-size:0.82rem; color:#ccc; flex:1; }
.cat-monto { font-size:0.82rem; color:#aaa; font-weight:500; }
.cat-arrow { font-size:0.7rem; color:#555; transition:transform 0.2s; margin-left:6px; }
.cat-arrow.open { transform:rotate(90deg); }
.cat-detalle { display:none; border-top:1px solid #2e2e2e; }
.cat-detalle.open { display:block; }
.concepto-item { display:flex; justify-content:space-between; align-items:center; padding:0.5rem 0.9rem 0.5rem 1.8rem; border-bottom:1px solid #2a2a2a; gap:8px; }
.concepto-item:last-child { border-bottom:none; }
.concepto-info { flex:1; min-width:0; }
.concepto-label { font-size:0.78rem; color:#999; }
.concepto-nota { font-size:0.65rem; color:#555; margin-top:1px; }
.inp-monto { background:#2e2e2e; border:1px solid #3a3a3a; border-radius:7px; color:#e0e0e0; font-size:0.78rem; font-family:inherit; padding:4px 8px; width:110px; text-align:right; outline:none; transition:border-color 0.2s; }
.inp-monto:focus { border-color:#a0a0f0; }
.inp-monto.modificado { border-color:#4caf82; color:#c8f0dc; }
.btn-del-sub { background:none; border:none; color:#444; font-size:1rem; cursor:pointer; padding:0 4px; flex-shrink:0; transition:color 0.2s; }
.btn-del-sub:hover { color:#e07070; }
.btn-edit-sub { background:none; border:none; color:#555; font-size:0.8rem; cursor:pointer; padding:0 4px; flex-shrink:0; transition:color 0.2s; }
.btn-edit-sub:hover { color:#a0a0f0; }
.edit-inline { display:none; padding:0.5rem 0.9rem 0.6rem 1.8rem; border-bottom:1px solid #2a2a2a; background:#1e1e2e; gap:6px; flex-direction:column; }
.edit-inline.open { display:flex; }
.edit-inline-row { display:flex; gap:6px; }
.inp-edit { flex:1; background:#2a2a2a; border:1px solid #3a3a3a; border-radius:7px; padding:4px 8px; color:#e8e8e8; font-size:0.78rem; font-family:inherit; outline:none; }
.inp-edit:focus { border-color:#a0a0f0; }
.btn-edit-ok { background:#2d2d6e; border:none; border-radius:7px; color:#fff; font-size:0.75rem; padding:4px 10px; cursor:pointer; white-space:nowrap; }
.btn-edit-ok:hover { background:#3d3d9e; }
.btn-edit-cancel { background:#333; border:none; border-radius:7px; color:#aaa; font-size:0.75rem; padding:4px 10px; cursor:pointer; }
.tag-custom { font-size:0.62rem; color:#a0a0f0; margin-left:4px; }
.nueva-sub { margin-top:1rem; background:#242424; border-radius:10px; padding:0.8rem 0.9rem; }
.nueva-sub-titulo { font-size:0.7rem; font-weight:600; color:#aaa; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:0.6rem; }
.nueva-sub-campos { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:6px; }
.nueva-sub-full { grid-column:1/-1; }
.inp-nueva { width:100%; background:#2a2a2a; border:1px solid #3a3a3a; border-radius:8px; padding:0.45rem 0.7rem; color:#e8e8e8; font-size:0.82rem; font-family:inherit; outline:none; transition:border-color 0.2s; }
.inp-nueva:focus { border-color:#a0a0f0; }
.sel-nueva { appearance:none; cursor:pointer; }
.btn-nueva { width:100%; background:#2d2d6e; border:none; border-radius:8px; color:#fff; font-size:0.85rem; font-weight:600; padding:0.5rem; cursor:pointer; transition:background 0.2s; }
.btn-nueva:hover { background:#3d3d9e; }
</style>
</head>
<body>

<div class="header">
  <div class="titulo">💰 Finanzas</div>
  <div class="mes-nav">
    <button class="btn-mes" id="btn-prev">‹</button>
    <div class="mes-actual" id="mes-label"></div>
    <button class="btn-mes" id="btn-next">›</button>
  </div>
</div>

<div class="metricas-top">
  <div class="card"><div class="card-label">Ingresos</div><div class="card-valor ingreso" id="v-ingresos">$0</div><div class="card-pct">100%</div></div>
  <div class="card"><div class="card-label">Gastos</div><div class="card-valor gasto" id="v-gastos">$0</div><div class="card-pct" id="v-gastos-pct">0%</div></div>
  <div class="card"><div class="card-label">Balance</div><div class="card-valor" id="v-balance">$0</div><div class="card-pct" id="v-balance-pct">0%</div></div>
</div>

<div class="pct-falta">
  <div class="pct-label">Gastos vs ingreso</div>
  <div class="pct-barra-track"><div class="pct-barra-fill" id="pct-barra" style="width:0%"></div></div>
  <div class="pct-textos"><span id="pct-left">—</span><span id="pct-right">0% usado</span></div>
</div>

<div class="seccion-titulo">Gasto por categoría — clic para ver y editar</div>
<div id="categorias"></div>

<div class="nueva-sub">
  <div class="nueva-sub-titulo">+ Agregar subcategoría</div>
  <div class="nueva-sub-campos">
    <input class="inp-nueva nueva-sub-full" id="ns-label" placeholder="Nombre de la subcategoría"/>
    <select class="inp-nueva sel-nueva" id="ns-cat">
      <option value="deudas">Créditos y deudas</option>
      <option value="hogar">Hogar y servicios</option>
      <option value="mascotas">Mascotas</option>
      <option value="transporte">Transporte</option>
      <option value="salud">Salud</option>
      <option value="suscripciones">Suscripciones digitales</option>
      <option value="variables">Variables / Alimentación</option>
    </select>
    <input class="inp-nueva" id="ns-monto" placeholder="$ Monto base" type="number" min="0"/>
    <input class="inp-nueva" id="ns-nota" placeholder="Nota (opcional)"/>
  </div>
  <button class="btn-nueva" id="btn-nueva-sub">Agregar subcategoría</button>
</div>

<script>
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

const CATS_DEF = [
  { key:'deudas', label:'Créditos y deudas', color:'#e07070', conceptos:[
    { id:'banco_chile',    label:'Cuota Banco Chile',         monto:130885, nota:'Cuota 20+/60 — termina ~2029' },
    { id:'banco_estado',   label:'Cuota Banco Estado',        monto:287581, nota:'Cuota 26+/48 — termina ~2027' },
    { id:'caja_andes',     label:'Caja los Andes',            monto:0,      nota:'TERMINADA ✓' },
    { id:'cae',            label:'CAE (TGR)',                  monto:0,      nota:'Ingresar cuando se regularice' },
    { id:'cencosud',       label:'Cencosud (en mora)',         monto:0,      nota:'Ingresar cuando se regularice' },
    { id:'falabella',      label:'Falabella/CMR (en mora)',    monto:0,      nota:'Ingresar cuando se regularice' },
  ]},
  { key:'hogar', label:'Hogar y servicios', color:'#7ab8f5', conceptos:[
    { id:'arriendo',       label:'Arriendo propio',            monto:100000, nota:'' },
    { id:'arriendo_mama',  label:'Arriendo mamá',              monto:0,      nota:'Solo meses que corresponde' },
    { id:'luz',            label:'Luz',                        monto:35000,  nota:'' },
    { id:'agua',           label:'Agua',                       monto:10000,  nota:'' },
    { id:'gas',            label:'Gas',                        monto:0,      nota:'Solo meses que corresponde' },
    { id:'internet',       label:'Internet',                   monto:15378,  nota:'' },
    { id:'telefono',       label:'Teléfono',                   monto:25262,  nota:'' },
    { id:'wom',            label:'Wom (cuotas)',               monto:0,      nota:'Ingresar si hay cuota' },
  ]},
  { key:'mascotas', label:'Mascotas', color:'#c3b1e1', conceptos:[
    { id:'sitter',         label:'Sitter',                     monto:250000, nota:'Necesario para trabajar' },
    { id:'comida_perros',  label:'Comida perros',              monto:110000, nota:'' },
    { id:'comida_gatos',   label:'Comida gatos',               monto:55000,  nota:'' },
    { id:'arena',          label:'Arena felinos',              monto:76000,  nota:'' },
    { id:'vet',            label:'Veterinaria',                monto:0,      nota:'Solo si hay' },
  ]},
  { key:'transporte', label:'Transporte', color:'#ffd166', conceptos:[
    { id:'bus',            label:'Pasajes bus Viña-Stgo',      monto:244000, nota:'Necesario para trabajar' },
    { id:'metro',          label:'Metro / micro local',        monto:0,      nota:'' },
    { id:'uber',           label:'Uber (puntual)',              monto:0,      nota:'' },
  ]},
  { key:'salud', label:'Salud', color:'#f7c59f', conceptos:[
    { id:'remedios',       label:'Remedios (venlafaxina)',     monto:12000,  nota:'' },
    { id:'psicologa',      label:'Psicóloga',                 monto:0,      nota:'Solo meses que corresponde' },
    { id:'otros_salud',    label:'Otros salud',                monto:0,      nota:'' },
  ]},
  { key:'suscripciones', label:'Suscripciones digitales', color:'#90e0ef', conceptos:[
    { id:'claude',         label:'Claude (IA)',                monto:21182,  nota:'' },
    { id:'spotify',        label:'Spotify',                    monto:6750,   nota:'' },
    { id:'mercadopago',    label:'MercadoPago',                monto:9990,   nota:'' },
    { id:'hbo',            label:'Max / HBO',                  monto:3995,   nota:'' },
    { id:'crunchyroll',    label:'Crunchyroll',               monto:3990,   nota:'' },
    { id:'bluehosting',    label:'Bluehosting',               monto:7140,   nota:'' },
    { id:'playstation',    label:'PlayStation',               monto:14441,  nota:'' },
  ]},
  { key:'variables', label:'Variables / Alimentación', color:'#b5ead7', conceptos:[
    { id:'mercaderia',     label:'Mercadería',                 monto:0,      nota:'Completar al mes' },
    { id:'feria',          label:'Feria / carnicería',         monto:0,      nota:'' },
    { id:'delivery',       label:'Comida fuera / delivery',    monto:0,      nota:'' },
    { id:'almuerzo',       label:'Almuerzo trabajo',           monto:0,      nota:'' },
    { id:'varios',         label:'Gastos varios',              monto:0,      nota:'' },
    { id:'piscina',        label:'Piscina Maxi',               monto:98000,  nota:'Solo temporada' },
  ]},
];

const BASE_INGRESOS = 2000000;
const CLAVE_CUSTOM = 'fin_custom_subs';
const hoy = new Date();
let mesIdx = hoy.getMonth();
let anio   = hoy.getFullYear();

function clavemes()    { return `fin6_${anio}_${mesIdx}`; }
function cargarMes()   { try { const s=localStorage.getItem(clavemes()); if(s) return JSON.parse(s); } catch(e){} return { ingresos:BASE_INGRESOS, overrides:{} }; }
function guardarMes(d) { try { localStorage.setItem(clavemes(), JSON.stringify(d)); } catch(e){} }
function cargarCustom()      { try { const s=localStorage.getItem(CLAVE_CUSTOM); if(s) return JSON.parse(s); } catch(e){} return []; }
function guardarCustom(lista){ try { localStorage.setItem(CLAVE_CUSTOM, JSON.stringify(lista)); } catch(e){} }

function montoBase(catKey, id) {
  const cat = CATS_DEF.find(c=>c.key===catKey);
  return cat?.conceptos.find(c=>c.id===id)?.monto ?? 0;
}
function getMonto(d, catKey, id) { return d.overrides?.[catKey]?.[id] ?? montoBase(catKey, id); }
function getMontoCustom(d, sub)  { return d.overrides?.[sub.catKey]?.[sub.id] ?? sub.monto; }
function getTotalCat(d, catKey) {
  const cat = CATS_DEF.find(c=>c.key===catKey);
  const baseTotal = cat.conceptos.reduce((a,c) => a+getMonto(d,catKey,c.id), 0);
  const customTotal = cargarCustom().filter(s=>s.catKey===catKey).reduce((a,s)=>a+getMontoCustom(d,s),0);
  return baseTotal + customTotal;
}
function fmt(n) { return '$'+Math.round(Math.abs(n)).toLocaleString('es-CL'); }

function crearInputMonto(val, base, catKey, id) {
  const inp = document.createElement('input');
  inp.className = 'inp-monto' + (val !== base ? ' modificado' : '');
  inp.type = 'text';
  inp.value = '$' + val.toLocaleString('es-CL');
  inp.dataset.cat  = catKey;
  inp.dataset.id   = id;
  inp.dataset.raw  = val;
  inp.dataset.base = base;
  inp.addEventListener('focus', () => { inp.value = parseInt(inp.dataset.raw)||0; inp.type='number'; });
  inp.addEventListener('blur', () => {
    const v = parseInt(inp.value)||0;
    inp.type='text'; inp.value='$'+v.toLocaleString('es-CL'); inp.dataset.raw=v;
    const d=cargarMes();
    if(!d.overrides) d.overrides={};
    if(!d.overrides[catKey]) d.overrides[catKey]={};
    d.overrides[catKey][id]=v;
    guardarMes(d);
    inp.classList.toggle('modificado', v!==parseInt(inp.dataset.base));
    actualizarMetricas();
  });
  return inp;
}

function actualizarMetricas() {
  const d = cargarMes();
  const totalGastos = CATS_DEF.reduce((a,cat)=>a+getTotalCat(d,cat.key),0);
  const balance = d.ingresos - totalGastos;
  const pctG = d.ingresos>0 ? totalGastos/d.ingresos : 0;
  document.getElementById('v-ingresos').textContent = fmt(d.ingresos);
  document.getElementById('v-gastos').textContent   = fmt(totalGastos);
  document.getElementById('v-gastos-pct').textContent = (pctG*100).toFixed(1)+'% del ingreso';
  const balEl = document.getElementById('v-balance');
  balEl.textContent  = (balance<0?'-':'')+fmt(balance);
  balEl.className    = 'card-valor '+(balance>=0?'pos':'neg');
  document.getElementById('v-balance-pct').textContent = (Math.abs(balance/d.ingresos*100)||0).toFixed(1)+'% '+(balance>=0?'disponible':'déficit');
  const pctU = Math.min(pctG*100,100);
  document.getElementById('pct-barra').style.width = pctU+'%';
  document.getElementById('pct-left').textContent  = balance>=0?`Quedan ${fmt(balance)} disponibles`:`Déficit de ${fmt(balance)}`;
  document.getElementById('pct-right').textContent = pctU.toFixed(1)+'% usado';
  CATS_DEF.forEach(cat => {
    const el = document.getElementById('total-'+cat.key);
    if(el) el.textContent = fmt(getTotalCat(cargarMes(), cat.key));
  });
}

function render() {
  document.getElementById('mes-label').textContent = MESES[mesIdx]+' '+anio;
  const d    = cargarMes();
  const cont = document.getElementById('categorias');
  cont.innerHTML = '';

  CATS_DEF.forEach(cat => {
    const bloque  = document.createElement('div');
    bloque.className = 'cat-bloque';

    const header = document.createElement('div');
    header.className = 'cat-header';
    header.innerHTML = `
      <div class="cat-dot" style="background:${cat.color}"></div>
      <div class="cat-nombre">${cat.label}</div>
      <div class="cat-monto" id="total-${cat.key}">${fmt(getTotalCat(d,cat.key))}</div>
      <div class="cat-arrow">▶</div>
    `;

    const detalle = document.createElement('div');
    detalle.className    = 'cat-detalle';
    detalle.dataset.catKey = cat.key;

    // Conceptos base
    cat.conceptos.forEach(con => {
      const val  = getMonto(d, cat.key, con.id);
      const base = montoBase(cat.key, con.id);

      const item = document.createElement('div');
      item.className = 'concepto-item';

      // Aplicar label/nota editados si existen
      const labelGuardado = d.labels?.[con.id]?.label || con.label;
      const notaGuardada  = d.labels?.[con.id]?.nota  ?? con.nota ?? '';
      // Ocultar si fue eliminado este mes
      const estaOculto = d.ocultos?.includes(con.id);

      const info = document.createElement('div');
      info.className = 'concepto-info';
      info.innerHTML = `<div class="concepto-label" id="lbl-${con.id}">${labelGuardado}</div><div class="concepto-nota" id="nota-${con.id}">${notaGuardada}</div>`;
      if (estaOculto) { item.style.display='none'; }

      const btnEdit = document.createElement('button');
      btnEdit.className = 'btn-edit-sub';
      btnEdit.title = 'Editar nombre/nota';
      btnEdit.textContent = '✎';

      const btnDel = document.createElement('button');
      btnDel.className = 'btn-del-sub';
      btnDel.textContent = '×';
      btnDel.title = 'Eliminar subcategoría';

      const acciones = document.createElement('div');
      acciones.style.cssText = 'display:flex;align-items:center;gap:2px;flex-shrink:0';
      acciones.appendChild(crearInputMonto(val, base, cat.key, con.id));
      acciones.appendChild(btnEdit);
      acciones.appendChild(btnDel);

      item.appendChild(info);
      item.appendChild(acciones);
      detalle.appendChild(item);

      // Form edición inline
      const editForm = document.createElement('div');
      editForm.className = 'edit-inline';
      editForm.innerHTML = `
        <div class="edit-inline-row">
          <input class="inp-edit" id="ef-label-${con.id}" value="${labelGuardado}" placeholder="Nombre"/>
          <input class="inp-edit" id="ef-nota-${con.id}"  value="${notaGuardada}" placeholder="Nota (opcional)"/>
        </div>
        <div class="edit-inline-row">
          <button class="btn-edit-ok"     id="ef-ok-${con.id}">Guardar</button>
          <button class="btn-edit-cancel" id="ef-cancel-${con.id}">Cancelar</button>
        </div>
      `;
      detalle.appendChild(editForm);

      btnEdit.addEventListener('click', e => {
        e.stopPropagation();
        editForm.classList.toggle('open');
      });

      editForm.querySelector(`#ef-cancel-${con.id}`).addEventListener('click', () => {
        editForm.classList.remove('open');
      });

      editForm.querySelector(`#ef-ok-${con.id}`).addEventListener('click', () => {
        const newLabel = editForm.querySelector(`#ef-label-${con.id}`).value.trim();
        const newNota  = editForm.querySelector(`#ef-nota-${con.id}`).value.trim();
        if (!newLabel) return;
        // Guardar en overrides de etiqueta
        const d2 = cargarMes();
        if (!d2.labels) d2.labels = {};
        d2.labels[con.id] = { label: newLabel, nota: newNota };
        guardarMes(d2);
        const lblEl  = document.getElementById(`lbl-${con.id}`);
        const notaEl = document.getElementById(`nota-${con.id}`);
        if (lblEl)  lblEl.textContent  = newLabel;
        if (notaEl) notaEl.textContent = newNota;
        editForm.classList.remove('open');
      });

      btnDel.addEventListener('click', e => {
        e.stopPropagation();
        if (!confirm(`¿Ocultar "${labelGuardado}" de este mes? Se puede restaurar el próximo mes.`)) return;
        const d2 = cargarMes();
        if (!d2.ocultos) d2.ocultos = [];
        if (!d2.ocultos.includes(con.id)) d2.ocultos.push(con.id);
        guardarMes(d2);
        item.style.display = 'none';
        editForm.style.display = 'none';
      });
    });

    // Conceptos custom
    cargarCustom().filter(s=>s.catKey===cat.key).forEach(sub => {
      const val = getMontoCustom(d, sub);

      // Fila principal
      const item = document.createElement('div');
      item.className = 'concepto-item';
      const info = document.createElement('div');
      info.className = 'concepto-info';
      info.innerHTML = `<div class="concepto-label" id="lbl-${sub.id}">${sub.label}<span class="tag-custom">● personalizado</span></div>${sub.nota?`<div class="concepto-nota" id="nota-${sub.id}">${sub.nota}</div>`:`<div class="concepto-nota" id="nota-${sub.id}"></div>`}`;

      const btnEdit = document.createElement('button');
      btnEdit.className = 'btn-edit-sub';
      btnEdit.title = 'Editar nombre/nota';
      btnEdit.textContent = '✎';

      const btnDel = document.createElement('button');
      btnDel.className = 'btn-del-sub';
      btnDel.textContent = '×';
      btnDel.title = 'Eliminar subcategoría';

      const acciones = document.createElement('div');
      acciones.style.cssText = 'display:flex;align-items:center;gap:2px;flex-shrink:0';
      acciones.appendChild(crearInputMonto(val, sub.monto, sub.catKey, sub.id));
      acciones.appendChild(btnEdit);
      acciones.appendChild(btnDel);

      item.appendChild(info);
      item.appendChild(acciones);
      detalle.appendChild(item);

      // Form edición inline
      const editForm = document.createElement('div');
      editForm.className = 'edit-inline';
      editForm.innerHTML = `
        <div class="edit-inline-row">
          <input class="inp-edit" id="ef-label-${sub.id}" value="${sub.label}" placeholder="Nombre"/>
          <input class="inp-edit" id="ef-nota-${sub.id}"  value="${sub.nota||''}" placeholder="Nota (opcional)"/>
        </div>
        <div class="edit-inline-row">
          <button class="btn-edit-ok"     id="ef-ok-${sub.id}">Guardar</button>
          <button class="btn-edit-cancel" id="ef-cancel-${sub.id}">Cancelar</button>
        </div>
      `;
      detalle.appendChild(editForm);

      // Eventos
      btnEdit.addEventListener('click', e => {
        e.stopPropagation();
        editForm.classList.toggle('open');
      });

      editForm.querySelector(`#ef-cancel-${sub.id}`).addEventListener('click', () => {
        editForm.classList.remove('open');
      });

      editForm.querySelector(`#ef-ok-${sub.id}`).addEventListener('click', () => {
        const newLabel = document.getElementById(`ef-label-${sub.id}`).value.trim();
        const newNota  = document.getElementById(`ef-nota-${sub.id}`).value.trim();
        if (!newLabel) return;
        const lista = cargarCustom();
        const idx = lista.findIndex(s=>s.id===sub.id);
        if (idx >= 0) { lista[idx].label = newLabel; lista[idx].nota = newNota; }
        guardarCustom(lista);
        // Actualizar UI sin re-renderizar todo
        const lblEl  = document.getElementById(`lbl-${sub.id}`);
        const notaEl = document.getElementById(`nota-${sub.id}`);
        if (lblEl)  lblEl.innerHTML  = `${newLabel}<span class="tag-custom">● personalizado</span>`;
        if (notaEl) notaEl.textContent = newNota;
        editForm.classList.remove('open');
      });

      btnDel.addEventListener('click', e => {
        e.stopPropagation();
        if(!confirm(`¿Eliminar "${sub.label}" de todos los meses?`)) return;
        guardarCustom(cargarCustom().filter(s=>s.id!==sub.id));
        render();
      });
    });

    header.addEventListener('click', () => {
      const arrow = header.querySelector('.cat-arrow');
      const isOpen = detalle.classList.toggle('open');
      arrow.classList.toggle('open', isOpen);
    });

    bloque.appendChild(header);
    bloque.appendChild(detalle);
    cont.appendChild(bloque);
  });

  actualizarMetricas();
}

// Navegación de mes
document.getElementById('btn-prev').addEventListener('click', () => { mesIdx--; if(mesIdx<0){mesIdx=11;anio--;} render(); });
document.getElementById('btn-next').addEventListener('click', () => { mesIdx++; if(mesIdx>11){mesIdx=0;anio++;} render(); });

// Agregar nueva subcategoría
document.addEventListener('DOMContentLoaded', () => { document.getElementById('btn-nueva-sub').addEventListener('click', () => {
  const label  = document.getElementById('ns-label').value.trim();
  const catKey = document.getElementById('ns-cat').value;
  const monto  = parseInt(document.getElementById('ns-monto').value)||0;
  const nota   = document.getElementById('ns-nota').value.trim();
  if(!label){ alert('Ingresa un nombre para la subcategoría'); return; }
  const lista = cargarCustom();
  lista.push({ id:'custom_'+Date.now(), catKey, label, monto, nota });
  guardarCustom(lista);
  document.getElementById('ns-label').value='';
  document.getElementById('ns-monto').value='';
  document.getElementById('ns-nota').value='';
  render();
}); }); // fin DOMContentLoaded

render();
</script>
</body>
</html>
