<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Finanzas</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#191919; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; }
.container { display:flex; flex-direction:column; align-items:center; gap:1.2rem; padding:2rem; }
.icon { font-size:2.5rem; }
.titulo { font-size:1.1rem; font-weight:600; color:#e0e0e0; }
.subtitulo { font-size:0.82rem; color:#666; text-align:center; }
.btn-google { background:#2d2d6e; border:none; border-radius:10px; color:#fff; font-size:0.9rem; font-weight:600; padding:0.75rem 1.8rem; cursor:pointer; display:flex; align-items:center; gap:10px; transition:background 0.2s; }
.btn-google:hover { background:#3d3d9e; }
.status { font-size:0.78rem; color:#555; text-align:center; min-height:1.2rem; }
.status.ok { color:#4caf82; }
.status.err { color:#e07070; }
.links { display:flex; gap:1rem; margin-top:0.5rem; }
.links a { font-size:0.78rem; color:#a0a0f0; text-decoration:none; padding:0.4rem 0.8rem; background:#242424; border-radius:8px; }
.links a:hover { background:#2d2d6e; }
</style>
</head>
<body>
<div class="container">
  <div class="icon">💰</div>
  <div class="titulo">Finanzas Personal</div>
  <div class="subtitulo">Inicia sesión una vez para acceder<br>desde Notion en cualquier dispositivo</div>
  <button class="btn-google" id="btn-login">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20H24v8h11.3C33.6 33.1 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 20-8 20-20 0-1.3-.1-2.7-.4-4z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.1 18.9 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.9 13.5-5l-6.2-5.2C29.4 35.6 26.8 36 24 36c-5.2 0-9.6-2.9-11.3-7.1l-6.5 5C9.5 39.5 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20H24v8h11.3c-.8 2.3-2.3 4.2-4.3 5.5l6.2 5.2C41 35.3 44 30 44 24c0-1.3-.1-2.7-.4-4z"/></svg>
    Continuar con Google
  </button>
  <div class="status" id="status"></div>
  <div class="links" id="links" style="display:none">
    <a href="finanzas.html">💰 Presupuesto</a>
    <a href="gastos.html">🧾 Gastos</a>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

const firebaseConfig = {
  apiKey: "AIzaSyBOQcAM_qUgsr2SiDO4ZJtHSHJP25g0GSA",
  authDomain: "finanzas-personal-12490.firebaseapp.com",
  projectId: "finanzas-personal-12490",
  storageBucket: "finanzas-personal-12490.firebasestorage.app",
  messagingSenderId: "1062344169400",
  appId: "1:1062344169400:web:75075634e2d4a416b3614d"
};

const app      = initializeApp(firebaseConfig);
const auth     = getAuth(app);
const provider = new GoogleAuthProvider();
const ALLOWED_EMAIL = 'plagosh1@gmail.com';

function setStatus(msg, cls='') { const el=document.getElementById('status'); el.textContent=msg; el.className='status '+cls; }

onAuthStateChanged(auth, user => {
  if (user && user.email === ALLOWED_EMAIL) {
    setStatus('✓ Sesión activa como ' + user.email, 'ok');
    document.getElementById('btn-login').textContent = 'Cerrar sesión';
    document.getElementById('btn-login').onclick = () => signOut(auth);
    document.getElementById('links').style.display = 'flex';
  } else {
    setStatus('');
    document.getElementById('btn-login').innerHTML = `<svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20H24v8h11.3C33.6 33.1 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 20-8 20-20 0-1.3-.1-2.7-.4-4z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.1 18.9 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.9 13.5-5l-6.2-5.2C29.4 35.6 26.8 36 24 36c-5.2 0-9.6-2.9-11.3-7.1l-6.5 5C9.5 39.5 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20H24v8h11.3c-.8 2.3-2.3 4.2-4.3 5.5l6.2 5.2C41 35.3 44 30 44 24c0-1.3-.1-2.7-.4-4z"/></svg> Continuar con Google`;
    document.getElementById('btn-login').onclick = () =>
      signInWithPopup(auth, provider)
        .then(result => { if(result.user.email !== ALLOWED_EMAIL) { signOut(auth); setStatus('Cuenta no autorizada','err'); } })
        .catch(e => setStatus('Error: '+e.message,'err'));
    document.getElementById('links').style.display = 'none';
  }
});
</script>
</body>
</html>
